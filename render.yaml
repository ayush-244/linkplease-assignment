# render.yaml — Render Blueprint Configuration

services:
  - type: web
    name: linkplease-api
    env: docker
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkplease-db
          property: connectionString
      - key: PSEUDOGRAM_BASE_URL
        value: https://pseudogram-api.onrender.com
      - key: PSEUDOGRAM_API_KEY
        sync: false # Must be set manually in the Render dashboard!

databases:
  - name: linkplease-db
    plan: free
    region: ohio
    databaseName: linkplease
    user: linkplease
